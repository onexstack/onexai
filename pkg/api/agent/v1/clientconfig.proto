// The shared external-endpoint contract. Every resource that calls a third-party
// HTTP endpoint (run-lifecycle hooks, custom commands, MCP servers, A2A peers,
// runtime profiles) uses this message instead of repeating url/service/caBundle.
syntax = "proto3";

package agent.v1;

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

// ServiceReference points at an in-cluster Service. It mirrors
// admissionregistration.k8s.io/v1 ServiceReference.
message ServiceReference {
    string namespace = 1;
    string name = 2;
    int32 port = 3;                // 0 means 443 (https) or 80 (http)
    string path = 4;
}

// ClientConfig is the Kubernetes-shaped endpoint configuration. url and service
// are mutually exclusive; caBundle is base64 PEM (protobuf bytes).
message ClientConfig {
    string url = 1;
    ServiceReference service = 2;
    bytes caBundle = 3;
    int32 timeoutSeconds = 4;
    bool insecureSkipTLSVerify = 5;
    map<string, string> headers = 6;
    // secretRef/secretKey resolve one credential value and send it as a bearer
    // token. headersRef imports every key of a Secret as headers. The two forms
    // are mutually exclusive.
    string secretRef = 7;
    string headersRef = 8;
    string secretKey = 9;
}
