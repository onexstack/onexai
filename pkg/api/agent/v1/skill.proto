// This file defines the Protobuf messages for managing Skills.
//
syntax = "proto3"; // Specifies the syntax version used in this file.

package agent.v1;

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

// Skill represents a skill repository (a bundle of prompt/context files loaded
// into an agent from a provider such as GitHub or GitLab).
message Skill {
    // 12 was the pre-rename spelling of namespace; it is removed and must not
    // be reused.
    reserved 12;

    string name = 1;
    string displayName = 2;
    string status = 3;
    string description = 4;
    string provider = 5;          // "github" | "gitlab" | "lark_doc"
    string params = 6;            // JSON string of provider params
    int32 cacheTtlSeconds = 7;
    map<string, string> labels = 8;
    int64 createdAt = 9;
    int64 updatedAt = 10;
    string asCmd = 11;             // "Yes" exposes this skill as a /cmd command
    string namespace = 16;                     // object namespace; empty = default

    // mode decides what a client receives. "hosted" (the default for records
    // written before this field) loads the full skill into the server-side
    // agent; "tool" runs the entrypoint and returns its output; "guide" returns
    // only the contract, so the skill body never leaves the server.
    string mode = 13;

    // contract is the compact description a local model needs to decide when to
    // delegate: when_to_use, inputs, outputs, acceptance, and the check command.
    string contract = 14;

    // entrypoint is the executable a "tool" skill runs. It is required for
    // mode=tool and ignored otherwise.
    string entrypoint = 15;
}

message CreateSkillRequest { Skill skill = 1; }
message CreateSkillResponse { Skill skill = 1; }
message UpdateSkillRequest { Skill skill = 1; }
message UpdateSkillResponse { Skill skill = 1; }
message DeleteSkillRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message DeleteSkillResponse {}
message GetSkillRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message GetSkillResponse { Skill skill = 1; }
message ListSkillRequest {
    // offset is how many records to skip before the page. It is ignored when
    // limit is zero, because that request asks for the whole list.
    // @gotags: form:"offset"
    int32 offset = 1;

    // limit caps how many records the page holds. Zero means no limit, which is
    // what this endpoint returned before it supported paging.
    // @gotags: form:"limit"
    int32 limit = 2;
}
message ListSkillResponse {
    repeated Skill skills = 1;

    // count is the total number of skills, independent of the page returned.
    int64 count = 2;
}
