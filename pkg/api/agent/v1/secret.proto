// This file defines the Protobuf messages for managing secrets.
//
syntax = "proto3"; // Specifies the syntax version used in this file.

package agent.v1;

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

// Secret is a named secret referenced by resources (keyed by SecretID).
message Secret {
    string secretId = 1;
    string secretKey = 2;
    string description = 3;
    int64 createdAt = 4;
    int64 updatedAt = 5;
}

message CreateSecretRequest { Secret secret = 1; }
message CreateSecretResponse { Secret secret = 1; }
message UpdateSecretRequest { Secret secret = 1; }
message UpdateSecretResponse { Secret secret = 1; }
message DeleteSecretRequest {
    // @gotags: uri:"secretId"
    string secretId = 1;
}
message DeleteSecretResponse {}
message GetSecretRequest {
    // @gotags: uri:"secretId"
    string secretId = 1;
}
message GetSecretResponse { Secret secret = 1; }
message ListSecretRequest {
    // offset is how many records to skip before the page. It is ignored when
    // limit is zero, because that request asks for the whole list.
    // @gotags: form:"offset"
    int32 offset = 1;

    // limit caps how many records the page holds. Zero means no limit, which is
    // what this endpoint returned before it supported paging.
    // @gotags: form:"limit"
    int32 limit = 2;
}
message ListSecretResponse {
    repeated Secret secrets = 1;

    // count is the total number of secrets, independent of the page returned.
    int64 count = 2;
}
