// This file defines the Protobuf messages for managing business lines
// (namespace records).
//
syntax = "proto3"; // Specifies the syntax version used in this file.

package agent.v1;

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

// Namespace is a business line: the platform metadata of a control-plane
// Kubernetes Namespace.
message Namespace {
    // name is both the business-line identifier and the control-plane
    // namespace name. It is immutable after creation.
    string name = 1;
    string displayName = 2;
    string description = 3;
    string owner = 4;
    map<string, string> labels = 5;
    int64 createdAt = 6;
    int64 updatedAt = 7;
}

message CreateNamespaceRequest { Namespace namespace = 1; }
message CreateNamespaceResponse { Namespace namespace = 1; }
message UpdateNamespaceRequest { Namespace namespace = 1; }
message UpdateNamespaceResponse { Namespace namespace = 1; }
message DeleteNamespaceRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message DeleteNamespaceResponse {}
message GetNamespaceRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message GetNamespaceResponse { Namespace namespace = 1; }
message ListNamespaceRequest {
    // offset is how many records to skip before the page. It is ignored when
    // limit is zero, because that request asks for the whole list.
    // @gotags: form:"offset"
    int32 offset = 1;

    // limit caps how many records the page holds. Zero means no limit, which is
    // what this endpoint returned before it supported paging.
    // @gotags: form:"limit"
    int32 limit = 2;
}
message ListNamespaceResponse {
    repeated Namespace namespaces = 1;

    // count is the total number of business lines, independent of the page
    // returned.
    int64 count = 2;

    // defaultNamespace is where an otherwise unscoped resource is written and
    // which namespace a run with no referrer is judged in. The console reads it
    // instead of hardcoding the deployment's default business line.
    string defaultNamespace = 3;
}
