// This file defines the Protobuf messages for managing prompt templates.
//
syntax = "proto3"; // Specifies the syntax version used in this file.

package agent.v1;

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

// Prompt is a reusable prompt template referenced by agents via prompts.
message Prompt {
    string name = 1;
    string displayName = 2;
    string status = 3;
    string description = 4;
    string content = 5;          // prompt template content
    map<string, string> labels = 6;
    int64 createdAt = 7;
    int64 updatedAt = 8;
    // namespace is the control-plane namespace (business line) the prompt lives
    // in. Empty means the deployment default.
    string namespace = 9;
}

message CreatePromptRequest { Prompt prompt = 1; }
message CreatePromptResponse { Prompt prompt = 1; }
message UpdatePromptRequest { Prompt prompt = 1; }
message UpdatePromptResponse { Prompt prompt = 1; }
message DeletePromptRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message DeletePromptResponse {}
message GetPromptRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message GetPromptResponse { Prompt prompt = 1; }
message ListPromptRequest {
    // offset is how many records to skip before the page. It is ignored when
    // limit is zero, because that request asks for the whole list.
    // @gotags: form:"offset"
    int32 offset = 1;

    // limit caps how many records the page holds. Zero means no limit, which is
    // what this endpoint returned before it supported paging.
    // @gotags: form:"limit"
    int32 limit = 2;
}
message ListPromptResponse {
    repeated Prompt prompts = 1;

    // count is the total number of prompts, independent of the page returned.
    int64 count = 2;
}
