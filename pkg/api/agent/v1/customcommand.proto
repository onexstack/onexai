// This file defines the Protobuf messages for user-defined slash commands.
//
syntax = "proto3"; // Specifies the syntax version used in this file.

package agent.v1;

import "github.com/onexstack/defaults/defaults.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

import "agent/v1/clientconfig.proto";

// CustomCommand is a user-defined slash command bound to agents. It is a
// declarative resource; the command's parameters and its execution body live in
// the spec, and running it is a REST call rather than a compiled-in action.
message CustomCommand {
    // 16 was the pre-rename spelling of namespace; it is removed and must not
    // be reused.
    reserved 16;

    string name = 1;
    string displayName = 2;
    string status = 3;
    string description = 4;
    bool enabled = 5;
    // type decides what an invocation executes: "prompt", "http" or "tool".
    string type = 6;
    repeated string aliases = 7;
    // usage is the human-facing invocation shape, e.g. "<service> [--env=prod]".
    string usage = 8;
    repeated CommandParameter parameters = 9;
    PromptCommand prompt = 10;
    HTTPCommand http = 11;
    ToolCommand tool = 12;
    CommandOutput output = 13;
    int32 timeoutSeconds = 14;
    map<string, string> labels = 15;
    int64 createdAt = 17;
    int64 updatedAt = 18;
    string namespace = 19;
}

// CommandParameter is one strictly-typed argument of a custom command. The list
// is arbitrary per command; the CLI-facing fields (in/short/required/default)
// are what let the chat service build a cobra command from it.
message CommandParameter {
    string name = 1;
    // in is "flag" (default) or "positional".
    string in = 2;
    // type is string|integer|number|boolean|duration|array|object|json.
    string type = 3;
    string description = 4;
    bool required = 5;
    // defaultValue is the JSON-encoded default; empty means no default.
    string defaultValue = 6;
    repeated string enums = 7;
    string format = 8;
    string short = 9;
    // schemaJson is the JSON-encoded schema for object/array/json parameters.
    string schemaJson = 10;
}

// PromptCommand renders a template and hands the result to the agent as a turn.
message PromptCommand {
    string template = 1;
}

// HTTPHeader is one outbound header. Its value is a template.
message HTTPHeader {
    string name = 1;
    string value = 2;
}

// Reference names another object in this API group.
message Reference {
    string name = 1;
    string namespace = 2;
}

// HTTPCommand proxies an external REST endpoint.
message HTTPCommand {
    string method = 1;
    // url and service are mutually exclusive.
    string url = 2;
    ServiceReference service = 3;
    string caBundle = 4;
    bool insecureSkipTLSVerify = 5;
    repeated HTTPHeader headers = 6;
    map<string, string> query = 7;
    string body = 8;
    string contentType = 9;
    Reference secretRef = 10;
    // sideEffects is None|NoneOnDryRun|Some|Unknown; only the first two permit
    // a dry-run invocation.
    string sideEffects = 11;
    // clientConfig is the shared Kubernetes-shaped endpoint configuration. It
    // replaces url/service/caBundle/insecureSkipTLSVerify when set.
    ClientConfig clientConfig = 12;
}

// ToolCommand calls one tool on an MCP server.
message ToolCommand {
    Reference mcpServer = 1;
    string tool = 2;
    string argumentsTemplate = 3;
}

// CommandOutput renders the result of an http or tool command.
message CommandOutput {
    string format = 1; // text|json|template
    string template = 2;
    string schemaJson = 3;
}

message CreateCustomCommandRequest { CustomCommand customCommand = 1; }
message CreateCustomCommandResponse { CustomCommand customCommand = 1; }
message UpdateCustomCommandRequest { CustomCommand customCommand = 1; }
message UpdateCustomCommandResponse { CustomCommand customCommand = 1; }
message DeleteCustomCommandRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message DeleteCustomCommandResponse {}
message GetCustomCommandRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message GetCustomCommandResponse { CustomCommand customCommand = 1; }
message ListCustomCommandRequest {
    // @gotags: form:"offset"
    int32 offset = 1;
    // @gotags: form:"limit"
    int32 limit = 2;
}
message ListCustomCommandResponse {
    repeated CustomCommand customCommands = 1;
    int64 count = 2;
}

// ContextCustomCommand is the summary a chat surface needs to build a cobra
// command: enough to render help and parse arguments, no execution internals.
message ContextCustomCommand {
    string name = 1;
    string displayName = 2;
    string description = 3;
    string usage = 4;
    string type = 5;
    repeated string aliases = 6;
    repeated CommandParameter parameters = 7;
    map<string, string> labels = 8;
}

message ListContextCustomCommandResponse {
    repeated ContextCustomCommand customCommands = 1;
}

// UserInfo mirrors authenticationv1.UserInfo: the caller's identity as the
// authenticator saw it.
message UserInfo {
    string username = 1;
    string uid = 2;
    repeated string groups = 3;
    map<string, StringList> extra = 4;
}

// StringList is the protobuf form of authenticationv1.ExtraValue.
message StringList {
    repeated string values = 1;
}

// InvocationContext describes the chat turn an invocation belongs to.
message InvocationContext {
    string conversationId = 1;
    string chatType = 2;
    string surface = 3;
}

// InvokeCustomCommandRequest is the review-style proposal: the caller names the
// command in the path and sends this body; the response fills InvocationStatus.
message InvokeCustomCommandRequest {
    // Default is hand-written in request_defaults.go: uid is a UUID generated
    // at bind time.
    option (defaults.unexported) = true;

    // 3 was the pre-rename spelling of namespace; it is removed and must not be
    // reused.
    reserved 3;

    // uid correlates the response with this request; generated when empty.
    string uid = 1;
    string agent = 2;
    UserInfo user = 4;
    InvocationContext context = 5;
    google.protobuf.Struct params = 6;
    bool dryRun = 7;
    string namespace = 8;
}

message PromptInvocation {
    string prompt = 1;
}

message HTTPInvocation {
    int32 status = 1;
    string contentType = 2;
    google.protobuf.Value body = 3;
    string rendered = 4;
    int64 elapsedMs = 5;
}

message ToolInvocation {
    string mcpServer = 1;
    string tool = 2;
    google.protobuf.Value arguments = 3;
    google.protobuf.Value result = 4;
    int64 elapsedMs = 5;
}

// InvocationStatus is the decision/result, shaped after SubjectAccessReview's
// status: phase distinguishes denial from execution failure, and
// evaluationError is reserved for "the call could not be completed".
message InvocationStatus {
    string phase = 1;   // Succeeded|Failed|Denied
    string reason = 2;
    string message = 3;
    string evaluationError = 4;
    repeated string warnings = 5;
    map<string, string> auditAnnotations = 6;
    google.protobuf.Struct params = 7;
    string usage = 8;
    PromptInvocation prompt = 9;
    HTTPInvocation http = 10;
    ToolInvocation tool = 11;
    CustomCommandApproval approval = 12;
}

// CustomCommandApproval is a parked tool invocation waiting for a human.
message CustomCommandApproval {
    string approvalId = 1;
    string command = 2;
    string agent = 3;
    string tool = 4;
    string mcpServer = 5;
    string argumentsJson = 6;
    int64 expiresAt = 7;
    string phase = 8;
}

message ApproveCustomCommandRequest {
    string approvalId = 1;
    // decision is "allow" or "deny".
    string decision = 2;
    string agent = 3;
    UserInfo user = 4;
}

message ApproveCustomCommandResponse {
    string approvalId = 1;
    string kind = 2;
    string name = 3;
    InvocationStatus status = 4;
}

message InvokeCustomCommandResponse {
    string uid = 1;
    string kind = 2;
    string name = 3;
    InvocationStatus status = 4;
}

// CustomCommandAudit is one recorded invocation.
message CustomCommandAudit {
    string uid = 1;
    string command = 2;
    string agent = 3;
    string kind = 4;
    string phase = 5;
    string reason = 6;
    string userId = 7;
    string conversationId = 8;
    string surface = 9;
    int64 durationMs = 10;
    string evaluationError = 11;
    int64 createdAt = 12;
}

message ListCustomCommandAuditRequest {
    // @gotags: form:"command"
    string command = 1;
    // @gotags: form:"agent"
    string agent = 2;
    // @gotags: form:"userId"
    string userId = 3;
    // @gotags: form:"phase"
    string phase = 4;
    // @gotags: form:"offset"
    int32 offset = 5;
    // @gotags: form:"limit"
    int32 limit = 6;
}

message ListCustomCommandAuditResponse {
    repeated CustomCommandAudit audits = 1;
    int64 count = 2;
}
