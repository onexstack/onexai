// This file defines the Protobuf messages for managing AgentTemplates.
//
syntax = "proto3"; // Specifies the syntax version used in this file.

package agent.v1;

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

// AgentTemplate is a reusable behavior unit that agents opt into through
// spec.templateRefs.
message AgentTemplate {
    // 5 was the pre-rename spelling of namespace; it is removed and must not be
    // reused.
    reserved 5;

    string name = 1;
    string displayName = 2;
    string status = 3;
    string description = 4;
    string namespace = 6;                     // object namespace; empty = default
    map<string, string> labels = 7;
    int64 createdAt = 8;
    int64 updatedAt = 9;

    // spec is the JSON-encoded AgentTemplateSpec. The declarative object is the
    // source of truth for the behavior, so re-modelling every selector, schema
    // and memory field here would create a second definition that can drift.
    // The handler decodes this into the same spec the controller expands.
    string spec = 10;
}

message CreateAgentTemplateRequest { AgentTemplate agentTemplate = 1; }
message CreateAgentTemplateResponse { AgentTemplate agentTemplate = 1; }
message UpdateAgentTemplateRequest { AgentTemplate agentTemplate = 1; }
message UpdateAgentTemplateResponse { AgentTemplate agentTemplate = 1; }
message DeleteAgentTemplateRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message DeleteAgentTemplateResponse {}
message GetAgentTemplateRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message GetAgentTemplateResponse { AgentTemplate agentTemplate = 1; }
message ListAgentTemplateRequest {
    // offset is how many records to skip before the page. It is ignored when
    // limit is zero, because that request asks for the whole list.
    // @gotags: form:"offset"
    int32 offset = 1;

    // limit caps how many records the page holds. Zero means no limit, which is
    // what this endpoint returned before it supported paging.
    // @gotags: form:"limit"
    int32 limit = 2;
}
message ListAgentTemplateResponse {
    repeated AgentTemplate agentTemplates = 1;

    // count is the total number of templates, independent of the page returned.
    int64 count = 2;
}
