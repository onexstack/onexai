// This file defines the Protobuf messages for managing RuntimeHostings.
//
syntax = "proto3"; // Specifies the syntax version used in this file.

package agent.v1;

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

// RuntimeHosting is a pool of runtime instances for one RuntimeProfile.
message RuntimeHosting {
    string name = 1;
    string namespace = 2;
    string displayName = 3;
    string status = 4;
    string description = 5;
    string owner = 6;
    string profileRef = 7;
    string mode = 8;
    string image = 9;
    repeated string command = 10;
    string env = 11;
    int32 maxInstances = 12;
    int64 idleTTLNanos = 13;
    string resources = 14;
    string instances = 15;
    map<string, string> labels = 16;
    int64 createdAt = 17;
    int64 updatedAt = 18;
}

message CreateRuntimeHostingRequest { RuntimeHosting runtimeHosting = 1; }
message CreateRuntimeHostingResponse { RuntimeHosting runtimeHosting = 1; }
message UpdateRuntimeHostingRequest { RuntimeHosting runtimeHosting = 1; }
message UpdateRuntimeHostingResponse { RuntimeHosting runtimeHosting = 1; }
message DeleteRuntimeHostingRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message DeleteRuntimeHostingResponse {}
message GetRuntimeHostingRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message GetRuntimeHostingResponse { RuntimeHosting runtimeHosting = 1; }
message ListRuntimeHostingRequest {
    // @gotags: form:"offset"
    int32 offset = 1;
    // @gotags: form:"limit"
    int32 limit = 2;
}
message ListRuntimeHostingResponse {
    repeated RuntimeHosting runtimeHostings = 1;
    int64 count = 2;
}
