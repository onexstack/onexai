// This file defines the Protobuf messages for managing SandboxTemplates.
//
syntax = "proto3"; // Specifies the syntax version used in this file.

package agent.v1;

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

// SandboxTemplate declares what a sandbox container is made of.
message SandboxTemplate {
    string name = 1;
    string namespace = 2;
    string displayName = 3;
    string description = 4;
    string status = 5;
    string image = 6;
    repeated string command = 7;
    repeated string env = 8;
    int64 ttlSeconds = 9;
    map<string, string> labels = 10;
    int64 createdAt = 11;
    int64 updatedAt = 12;
}

message CreateSandboxTemplateRequest { SandboxTemplate sandboxTemplate = 1; }
message CreateSandboxTemplateResponse { SandboxTemplate sandboxTemplate = 1; }
message UpdateSandboxTemplateRequest { SandboxTemplate sandboxTemplate = 1; }
message UpdateSandboxTemplateResponse { SandboxTemplate sandboxTemplate = 1; }
message DeleteSandboxTemplateRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message DeleteSandboxTemplateResponse {}
message GetSandboxTemplateRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message GetSandboxTemplateResponse { SandboxTemplate sandboxTemplate = 1; }
message ListSandboxTemplateRequest {
    // @gotags: form:"offset"
    int32 offset = 1;
    // @gotags: form:"limit"
    int32 limit = 2;
}
message ListSandboxTemplateResponse {
    repeated SandboxTemplate sandboxTemplates = 1;
    int64 count = 2;
}
