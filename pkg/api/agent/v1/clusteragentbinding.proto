// This file defines the Protobuf messages for managing ClusterAgentBindings.
//
syntax = "proto3"; // Specifies the syntax version used in this file.

package agent.v1;

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

import "agent/v1/agent.proto";
import "agent/v1/agentbinding.proto";

// ClusterAgentBindingSpec is the desired state of a cluster-wide binding.
message ClusterAgentBindingSpec {
    // enabled is tri-state: absent means enabled.
    optional bool enabled = 1;
    string displayName = 2;
    string description = 3;
    AgentBindingSubject owner = 4;

    // namespaces is the explicit tenant list this binding may contribute to.
    repeated string namespaces = 5;

    AgentBindingLabelSelector agentSelector = 6;
    repeated ObjectReference agents = 7;

    repeated ObjectReference prompts = 8;
    repeated ObjectReference skills = 9;
    repeated ObjectReference knowledgeBases = 10;
    repeated ObjectReference mcpservers = 11;
    repeated ObjectReference customCommands = 12;
    repeated string commands = 13;
    ObjectReference memoryRef = 14;
    ObjectReference modelRef = 15;
    // commandSelector selects catalog commands by label, unioned with
    // commands. Every Command object carries its group as the label
    // agent.onexstack.io/group, so "group in (duty)" grants the whole group.
    AgentBindingLabelSelector commandSelector = 16;
}

// ClusterAgentBindingStatus is the observed state. It is read-only.
message ClusterAgentBindingStatus {
    int64 observedGeneration = 1;
    int32 matchedNamespaces = 2;
    int32 matchedAgents = 3;
    AgentBindingResolved resolved = 4;
    repeated string missing = 5;
}

// ClusterAgentBinding represents one cluster-wide binding.
message ClusterAgentBinding {
    string name = 1;
    map<string, string> labels = 2;
    ClusterAgentBindingSpec spec = 3;
    ClusterAgentBindingStatus status = 4;
    int64 createdAt = 5;
    int64 updatedAt = 6;
}

message CreateClusterAgentBindingRequest { ClusterAgentBinding clusterAgentBinding = 1; }
message CreateClusterAgentBindingResponse { ClusterAgentBinding clusterAgentBinding = 1; }
message UpdateClusterAgentBindingRequest { ClusterAgentBinding clusterAgentBinding = 1; }
message UpdateClusterAgentBindingResponse { ClusterAgentBinding clusterAgentBinding = 1; }
message DeleteClusterAgentBindingRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message DeleteClusterAgentBindingResponse {}
message GetClusterAgentBindingRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message GetClusterAgentBindingResponse { ClusterAgentBinding clusterAgentBinding = 1; }
message ListClusterAgentBindingRequest {
    // @gotags: form:"offset"
    int32 offset = 1;
    // @gotags: form:"limit"
    int32 limit = 2;
}
message ListClusterAgentBindingResponse {
    repeated ClusterAgentBinding clusterAgentBindings = 1;
    int64 count = 2;
}
