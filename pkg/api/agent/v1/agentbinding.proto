// This file defines the Protobuf messages for managing AgentBindings.
//
syntax = "proto3"; // Specifies the syntax version used in this file.

package agent.v1;

import "agent/v1/agent.proto";

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

// AgentBindingLabelSelectorRequirement is one selector expression.
message AgentBindingLabelSelectorRequirement {
    string key = 1;
    string operator = 2;
    repeated string values = 3;
}

// AgentBindingLabelSelector mirrors metav1.LabelSelector.
message AgentBindingLabelSelector {
    map<string, string> matchLabels = 1;
    repeated AgentBindingLabelSelectorRequirement matchExpressions = 2;
}

// AgentBindingSubject is the principal a binding belongs to.
message AgentBindingSubject {
    string kind = 1;
    string name = 2;
    string apiGroup = 3;
}

// AgentBindingSpec is the desired state of a binding.
message AgentBindingSpec {
    // enabled is tri-state: absent means enabled.
    optional bool enabled = 1;
    string displayName = 2;
    string description = 3;
    AgentBindingSubject owner = 4;
    AgentBindingLabelSelector selector = 5;
    repeated string agents = 6;
    repeated ObjectReference prompts = 7;
    repeated ObjectReference skills = 8;
    repeated ObjectReference knowledgeBases = 9;
    repeated ObjectReference mcpservers = 10;
    repeated ObjectReference customCommands = 11;
    repeated string commands = 12;
    // modelRef names the model endpoint this binding contributes. The agent's
    // own modelRef wins; a binding supplies one only when the agent has none.
    ObjectReference modelRef = 13;
    // commandSelector selects catalog commands by label, unioned with
    // commands. Every Command object carries its group as the label
    // agent.onexstack.io/group, so "group in (duty)" grants the whole group.
    AgentBindingLabelSelector commandSelector = 14;
}

// AgentBindingResolved is what one binding contributes.
message AgentBindingResolved {
    repeated string prompts = 1;
    repeated string skills = 2;
    repeated string mcps = 3;
    repeated string knowledgeBases = 4;
    repeated string customCommands = 5;
    repeated string commands = 6;
}

// AgentBindingStatus is the observed state. It is read-only.
message AgentBindingStatus {
    int64 observedGeneration = 1;
    int32 matchedAgents = 2;
    AgentBindingResolved resolved = 3;
    repeated string missing = 4;
}

// AgentBinding represents one binding.
message AgentBinding {
    string name = 1;
    string namespace = 2;
    map<string, string> labels = 3;
    AgentBindingSpec spec = 4;
    AgentBindingStatus status = 5;
    int64 createdAt = 6;
    int64 updatedAt = 7;
}

message CreateAgentBindingRequest { AgentBinding agentBinding = 1; }
message CreateAgentBindingResponse { AgentBinding agentBinding = 1; }
message UpdateAgentBindingRequest { AgentBinding agentBinding = 1; }
message UpdateAgentBindingResponse { AgentBinding agentBinding = 1; }
message DeleteAgentBindingRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message DeleteAgentBindingResponse {}
message GetAgentBindingRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message GetAgentBindingResponse { AgentBinding agentBinding = 1; }
message ListAgentBindingRequest {
    // @gotags: form:"offset"
    int32 offset = 1;
    // @gotags: form:"limit"
    int32 limit = 2;
}
message ListAgentBindingResponse {
    repeated AgentBinding agentBindings = 1;
    int64 count = 2;
}
