// This file defines the Protobuf messages for managing model endpoints.
//
syntax = "proto3"; // Specifies the syntax version used in this file.

package agent.v1;

import "github.com/onexstack/defaults/defaults.proto";

option go_package = "github.com/onexstack/onexai/pkg/api/agent/v1;v1";

// Model is a named LLM model endpoint configuration.
message Model {
    string name = 1;
    string displayName = 2;
    string status = 3;
    string description = 4;
    string provider = 5;         // "openai" | "deepseek" | ...
    string baseUrl = 6;
    string apiKey = 7;
    string model = 8;
    map<string, string> labels = 9;
    int64 createdAt = 10;
    int64 updatedAt = 11;
    // capabilities declares what this endpoint can do beyond text. Known
    // values:
    //
    //   "vision"           accepts image input
    //   "image-generation" serves /v1/images/generations
    //   "url-images"       can fetch an http(s) image URL itself, so a
    //                      reference may be passed through instead of inlined
    //   "reasoning"        streams a reasoning channel
    //
    // A repeated string rather than a bool per capability, because adding one
    // is then a value rather than a field number, and because it can carry the
    // capabilities (reasoning) that were implicit in the provider before.
    //
    // Empty means "not declared", and every reader falls back to what it
    // inferred before this field existed. That fallback is what makes this
    // safe to add to a running deployment: no model row has to be written
    // before the field is read.
    repeated string capabilities = 12;
    // owner scopes this endpoint to a subject. Empty means a platform-wide
    // endpoint; a non-empty value is the platform user that configured it.
    string owner = 13;
    // hasAPIKey reports whether a key is stored. The key itself is never
    // returned by a read.
    bool hasAPIKey = 14;
    // namespace is the business line that owns this endpoint. It is part of
    // the reference identity: a model in another namespace is reachable only
    // through a ReferenceGrant, just like an MCP server or a skill.
    string namespace = 15;
}

// TestModelRequest asks the runtime to make one minimal completion against an
// endpoint. The inline model may carry a key; when it does not, name selects a
// stored row whose key is borrowed.
message TestModelRequest {
    // Default is hand-written in request_defaults.go: name falls back to the
    // inline model's name at bind time.
    option (defaults.unexported) = true;

    Model model = 1;
    string name = 2;
}

// TestModelResponse reports the outcome of one connectivity test.
message TestModelResponse {
    bool ok = 1;
    int64 latencyMs = 2;
    // message is a bounded, user-facing description of the outcome. An upstream
    // HTTP failure is rendered as "upstream returned <code>: <summary>", where
    // the summary is parsed from the response's error message and truncated. It
    // never contains request headers or the api key.
    string message = 3;
}

message CreateModelRequest { Model model = 1; }
message CreateModelResponse { Model model = 1; }
message UpdateModelRequest { Model model = 1; }
message UpdateModelResponse { Model model = 1; }
message DeleteModelRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message DeleteModelResponse {}
message GetModelRequest {
    // @gotags: uri:"name"
    string name = 1;
}
message GetModelResponse { Model model = 1; }
message ListModelRequest {
    // offset is how many records to skip before the page. It is ignored when
    // limit is zero, because that request asks for the whole list.
    // @gotags: form:"offset"
    int32 offset = 1;

    // limit caps how many records the page holds. Zero means no limit, which is
    // what this endpoint returned before it supported paging.
    // @gotags: form:"limit"
    int32 limit = 2;
}
message ListModelResponse {
    repeated Model models = 1;

    // count is the total number of models, independent of the page returned.
    int64 count = 2;
}
