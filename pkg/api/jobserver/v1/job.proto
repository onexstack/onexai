syntax = "proto3"; // Specifies the syntax version used in this file.

package jobserver.v1;

import "google/protobuf/timestamp.proto"; // Importing Google's timestamp type for date/time fields.

// Specifies the Go package for generated code.
option go_package = "github.com/onexstack/onexai/pkg/api/jobserver/v1;v1";

message Job {
    // Job 名称
    string name = 1;
    // Job ID
    string jobID = 2;
    // 创建人
    string userID = 3;
    // CronJob ID
    string cronJobID = 4;
    // Job 作用域
    string scope = 5;
    // Job 描述
    string description = 6;
    string watcher  = 7;
    // Job 参数
    JobParams params = 8;
    // Job 执行结果
    JobResults results  = 9;
    // Job 状态：Pending、Running、Succeeded、Failed
    string status = 10;
    // Job 状态：Pending、Running、Succeeded、Failed
    repeated JobCondition conditions  = 11;
    // Job 开始时间
    int64 startedAt  = 12;
    // Job 结束时间
    int64 endedAt  = 13;
    // 创建时间
    google.protobuf.Timestamp createdAt = 14;
    // 更新时间
    google.protobuf.Timestamp updatedAt = 15;
}

message JobParams{
    TrainParams train = 1;
    // 触发来源的 Lark/API 回执上下文，供 watcher 执行完把结果推回发起会话。
    AgentParams agent = 2;
}

message AgentParams {
    // 回执目标类型（open_id / chat_id / user_id / api）。
    string receiverType = 1;
    // 回执目标 ID（Lark 的 chat_id 或 open_id）。
    string receiverID = 2;
    // 调用者是否为 SRE。
    bool isSRE = 3;
}

message TrainParams {
    int64 idempotentExecution = 1;
    int64 jobTimeout  = 2;
    int64 batchSize = 3;
}

message JobResults{
    TrainResults train = 1;
}

message TrainResults {
    optional string embeddedDataPath = 1;
    optional string taskID= 2;
    optional string dataPath = 4;
    optional string resultPath = 3;
}

message JobCondition {
    // Type of the condition (e.g., "Downloaed", "Embedded", "Evaluated")
    string type = 1;
    // Status of the condition (True, False, Unknown)
    string status = 2;
    // Message provides additional information when the condition is false
    string message = 3;
    // Last time the condition transitioned from one status to another.
    string lastTransitionTime = 4;
}

message CreateJobRequest{
    Job job = 1;
}

message CreateJobResponse{
    string jobID = 1;
}

message UpdateJobRequest{
    // @gotags: uri:"jobID"
    string jobID = 1;
    optional string name = 2;
    optional string description = 3;
    optional JobParams params = 4;
    optional JobResults results  = 5;
    optional string status = 6;
}

message UpdateJobResponse{
}

message DeleteJobRequest{
    repeated string jobIDs = 1;
}

message DeleteJobResponse{
}

message GetJobRequest{
    // @gotags: uri:"jobID"
    string jobID = 1;
}

message GetJobResponse{
    Job job = 1;
}

message ListJobRequest{
    // @gotags: form:"offset"
    int32 offset = 1;
    // @gotags: form:"limit"
    int32 limit = 2;
}

message ListJobResponse{
    int64 total = 1;
    repeated Job jobs = 2;
}

