name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module path and public tree
        run: ./scripts/verify-public.sh

      - name: Use the released onexstack module
        # The working tree replaces onexstack with ../onexstack for local
        # development; a fresh CI checkout has no sibling directory. Compose
        # image builds already drop the replace and use the version required by
        # go.mod, so do the same here and record the go.sum hash that go build
        # needs.
        run: |
          go mod edit -dropreplace=github.com/onexstack/onexstack
          go mod download github.com/onexstack/onexstack

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          # etcd authpb and polarismesh security both register auth.proto.
          GOLANG_PROTOBUF_REGISTRATION_CONFLICT: warn
        run: go test -short ./...

  lint:
    name: Defensive lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Use the released onexstack module
        run: |
          go mod edit -dropreplace=github.com/onexstack/onexstack
          go mod download github.com/onexstack/onexstack
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --config=.golangci-defensive.yaml
